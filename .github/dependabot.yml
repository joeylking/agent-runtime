# Dependabot only bumps a version already required somewhere in a go.mod; it
# never proposes a dependency nobody imports yet. The core module keeps
# exactly two direct dependencies (a JSON Schema validator and SQLite, see
# go.mod and CONTRIBUTING.md's "Module layout" section): a third is a design
# decision an issue and a PR argue for, not something that arrives as a
# version bump. Nested modules take on provider SDKs and the MCP SDK because
# that is the whole reason they are separate modules.
#
# Each entry below is grouped so a week with several updates in the same
# ecosystem and directory still opens at most one pull request, not one per
# dependency.
#
# cooldown holds a version back until it has been published for this many
# days, so a version is not proposed the day a compromised maintainer
# account or a build system pushes it, before the ecosystem has had a
# chance to notice and yank it. gomod supports separate days per semver
# bump (checked against the current Dependabot configuration reference);
# github-actions supports only default-days, not a per-bump split.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      gomod:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
