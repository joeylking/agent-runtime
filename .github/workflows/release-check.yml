name: release-check

# ci.yml's "modules" job builds every nested module through a go.work
# workspace so it resolves the in-tree core, which is what makes day-to-day
# development across modules practical: on an ordinary commit, a nested
# module may legitimately need core symbols newer than the release its
# go.mod pins, because the core and the module are worked on together before
# either is re-tagged. That means ci.yml never builds the dependency graph a
# consumer actually resolves — go.mod's pinned github.com/joeylking/agent-runtime
# version, not the workspace override.
#
# This workflow builds that graph, with GOWORK=off so nothing overrides the
# pin. It does not run on every push, because "needs a newer core than it
# pins" is the normal state of a module mid-development, not a bug; it runs
# before a nested module is tagged, and a nested module is tagged only after
# this workflow is green for the commit being tagged. See CONTRIBUTING.md's
# release procedure.
# The tag filters match nested-module tags only: one directory level
# (mcp/v0.2.0) and two (providers/ollama/v0.2.0). They must not match a
# core tag: when the core is tagged the nested modules still pin the
# previous core, so this check could only fail there. "**/v*" would match
# a core tag, because "**/" also matches nothing, which is how v0.3.0 came
# to carry a failed run of this workflow.
#
# GitHub creates no push event when more than three tags are pushed at
# once, so push nested tags one at a time if a run per tag is wanted. The
# manual run on the commit being tagged is the gate either way.
on:
  push:
    tags:
      - "*/v*"
      - "*/*/v*"
  schedule:
    - cron: "44 6 * * 1"
  workflow_dispatch:
    inputs:
      examples:
        description: "Also check examples/live and examples/mcp, which pin the nested modules' tags"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref != 'refs/heads/main' && github.event_name != 'schedule' }}

env:
  GOTOOLCHAIN: local

jobs:
  release-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      # The examples pin the nested modules' own tags, so they can only be
      # re-pinned after those tags exist. A nested tag's push, and the
      # manual run that precedes it, therefore check the six library
      # modules; the schedule and an ordinary manual run check everything.
      - name: nested modules against their pinned core
        env:
          WITH_EXAMPLES: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.examples) }}
        run: |
          modules="providers/ollama providers/anthropic providers/openai mcp bench export/otel"
          if [ "$WITH_EXAMPLES" = "true" ]; then
            modules="$modules examples/live examples/mcp"
          fi
          for m in $modules; do
            echo "== $m"
            (
              cd "$m"
              GOWORK=off go mod verify
              GOWORK=off go mod tidy -diff
              GOWORK=off go build ./...
              GOWORK=off go vet ./...
              GOWORK=off go test -race -count=1 ./...
              GOWORK=off govulncheck ./...
            )
          done
